[package]
name = "strata-session"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native Rust remote-session engine replacing the Apache Guacamole C daemon (guacd)."
publish = false

[lib]
path = "src/lib.rs"

[features]
default = ["ssh"]
# Real protocol engines. Each pulls a substantial dependency tree, so
# they are opt-in and can be rolled out one at a time (ADR-0015 Phase 2).
ssh = ["dep:russh"]
# Server-side terminal rasteriser, needed only by Guacamole Wire
# Compatibility Mode. Native Direct Streaming sends raw PTY bytes to
# xterm.js and does not pull this in.
terminal = ["dep:alacritty_terminal", "dep:fontdue", "dep:image"]
# RDP engine. Replaces FreeRDP: sans-I/O state machine, no hidden threads.
rdp = [
    "dep:ironrdp-connector",
    "dep:ironrdp-session",
    "dep:ironrdp-tokio",
    "dep:ironrdp-tls",
    "dep:ironrdp-pdu",
    "dep:ironrdp-graphics",
    "dep:ironrdp-core",
    "dep:ironrdp-cliprdr",
    "dep:ironrdp-dvc",
    "dep:ironrdp-displaycontrol",
    "dep:ironrdp-rdpsnd",
    "dep:ironrdp-rdpdr",
    "dep:ironrdp-egfx",
    "dep:rustls-native-certs",
    "dep:rustls-pki-types",
    "dep:x509-cert",
    "dep:sspi",
    "dep:image",
]
# VNC engine. Also the transport behind `web`, which runs a browser in a
# container and exposes it over RFB.
vnc = ["dep:vnc-rs", "dep:image"]
# Kubernetes exec engine. A WebSocket to the API server rather than a
# protocol of its own, so it reuses the SSH engine's keymap and the
# terminal rasteriser.
kubernetes = [
    "dep:tokio-tungstenite",
    "dep:rustls-native-certs",
    "dep:rustls-pki-types",
    "dep:pkcs8",
]
# File transfer. Not a protocol: it decorates any engine, because guacd
# offers it on RDP and VNC too by opening a second SSH connection.
sftp = ["dep:russh-sftp", "dep:russh", "dep:serde_json"]
# Enables RSA host keys and RSA public-key auth (russh's `rsa` feature).
#
# The backend turns it on (v2.3.6): network devices such as Cisco IOS
# switches present only RSA host keys, and without it the handshake fails
# before any key is offered. It pulls `rsa =0.10.0-rc.18`, the version the
# RDP stack already compiles, so it adds no crate. RUSTSEC-2023-0071 (Marvin)
# times RSA *private-key* operations; verifying a host's RSA signature uses
# the public key, and an RSA user key signs once per login, far from the
# many timed operations the attack needs. See osv-scanner.toml.
ssh-rsa = ["ssh", "russh/rsa"]

# IMPORTANT: this crate runs in the TRUSTED internal zone, never in the
# DMZ. `crates/strata-dmz` MUST NOT depend on it — the edge reaches the
# session tier over a signed socket, not in-process. Enforced by
# .github/workflows/dmz-deps.yml. See
# docs/adr/ADR-0015-native-rust-session-engine.md.

[dependencies]
strata-protocol = { path = "../strata-protocol" }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-rustls = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }

# Wire parsing
winnow = { workspace = true }
base64 = { workspace = true }
# Certificate fingerprints, for the pinning path in `tls.rs`.
sha2 = { workspace = true }

# Secrets
secrecy = { workspace = true }
zeroize = { workspace = true }

# Errors / logging
thiserror = { workspace = true }
tracing = { workspace = true }

# SSH engine (feature `ssh`)
#
# Pinned to >=0.60.3 on purpose: RUSTSEC-2026-0153/0154 (CVE-2026-46673)
# are only patched there. In releases before 0.58 the vulnerable
# `CryptoVec` growth is reachable from *remote* SSH traffic — transport
# packet reads and zlib decompression — and can abort the process. This
# engine runs in-process inside the backend, so that abort would take
# every RDP session down with it. That rules out the older russh that
# current `ironrdp` would otherwise force us onto; see the version note
# on the RDP dependencies below. 0.64 also enforces rekey read/time limits
# (#766); its `legacy-ed25519-pkcs8-parser` removal changes nothing here,
# because that opt-in feature was never enabled. 0.64.1 fixes
# GHSA-4wc5-f2rc-q74m (agent server; unreachable here, agent forwarding is declined).
#
# `ring` rather than the default `aws-lc-rs`: aws-lc is a C library, and
# removing C from the session tier is the point of this crate. rustls
# already standardises the workspace on ring.
russh = { version = "0.64.1", optional = true, default-features = false, features = [
    "ring",
    "flate2",
] }

# Terminal rasteriser (feature `terminal`)
# No shaping engine: a monospace grid needs glyph rasterisation and
# nothing else, so `fontdue` replaces the cosmic-text/tiny-skia stack.
alacritty_terminal = { version = "0.26", optional = true }
fontdue = { version = "0.9", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = [
    "png",
    "webp",
] }

# RDP engine (feature `rdp`)
#
# Crate version note: this is the current `ironrdp` line (meta-crate 0.17;
# the sub-crates are numbered independently). It resolves beside a patched
# `russh` only because of the three-line fork in
# `crates/vendor/ironrdp-connector`, registered as a workspace
# `[patch.crates-io]` — stock connector 0.10 pins `picky =7.0.0-rc.25`,
# which pins `curve25519-dalek =5.0.0-rc.1`, and `russh` >=0.60.3 needs
# 5.0.0 stable. Run `scripts/check-vendored-forks.sh` to see whether the
# fork can be dropped yet; the reasoning is in
# docs/adr/ADR-0015-native-rust-session-engine.md.
#
# The whole set has to agree on a single `ironrdp-svc` (0.8). Mismatched
# satellites resolve happily and then fail to typecheck — that is how this
# set was arrived at.
ironrdp-connector = { version = "0.10", optional = true }
ironrdp-session = { version = "0.11", optional = true }
ironrdp-tokio = { version = "0.10", optional = true }
# `rustls-ring`, not the default aws-lc-rs: same no-C reasoning as russh,
# and `deny.toml` bans native-tls outright.
ironrdp-tls = { version = "0.2", optional = true, default-features = false, features = [
    "rustls-ring",
] }
ironrdp-pdu = { version = "0.9", optional = true }
ironrdp-graphics = { version = "0.9", optional = true }
ironrdp-core = { version = "0.2", optional = true }
# Clipboard virtual channel.
ironrdp-cliprdr = { version = "0.7", optional = true }
# Dynamic virtual channels, and the Display Control channel they carry.
# Without these the desktop is stuck at its initial size and the browser
# has to scale the framebuffer, which looks blurry.
ironrdp-dvc = { version = "0.8", optional = true }
ironrdp-displaycontrol = { version = "0.8", optional = true }
# Audio output.
ironrdp-rdpsnd = { version = "0.9", optional = true }
ironrdp-rdpdr = { version = "0.7", optional = true }
# Graphics pipeline (MS-RDPEGFX), the channel H.264 arrives on. Vendored:
# stock 0.3 will not advertise AVC without a local decoder, and its only
# decoder is the openh264 C library. See crates/vendor/ironrdp-egfx.
ironrdp-egfx = { version = "0.3", optional = true }
# VNC/RFB client. Pure Rust with no `-sys` crate anywhere in its tree,
# which is the same reason FreeRDP was replaced rather than wrapped.
vnc-rs = { version = "0.5", optional = true }
# Kubernetes exec transport (feature `kubernetes`). The `kube` crate was
# not used: it carries an ~80-deep tree for an API this engine touches at
# exactly one endpoint. rustls rather than native-tls, which deny.toml bans.
tokio-tungstenite = { version = "0.29", optional = true, default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-native-roots",
] }
# PEM parsing for the connection's CA and client certificate. The
# unmaintained rustls-pemfile is deliberately avoided (RUSTSEC-2025-0134).
rustls-pki-types = { workspace = true, optional = true }
# Decrypts a password-protected client key. Version tracks what is
# already in the tree so only one copy is built.
pkcs8 = { version = "0.11", optional = true, features = ["encryption", "pem"] }
# SFTP subsystem (feature `sftp`), built for the russh already in tree.
russh-sftp = { version = "3.0", optional = true }
# Directory listings are a JSON object on the wire, and hand-rolling the
# escaping for filenames the operator does not control is not worth it.
serde_json = { workspace = true, optional = true }
# TLS is driven directly rather than through ironrdp-tls, which accepts
# any certificate and so cannot honour a connection's ignore-cert
# setting. The tokio-rustls above is the workspace pin, already ring-only
# so the process keeps a single crypto provider.
rustls-native-certs = { version = "0.8", optional = true }
x509-cert = { version = "0.2", optional = true }
# Needed directly for the KDC network client CredSSP suspends on during
# Kerberos authentication. Version tracks what ironrdp-connector 0.10 uses
# once forked onto picky rc.26; 0.22 itself is vendored in
# `crates/vendor/sspi` to drop a mechListMIC sequence check that rejects
# Kerberos NLA against Windows RDP hosts. Default features off: only two
# types are used from it, and the defaults drag in a blocking reqwest
# stack that is both unused and extra attack surface.
sspi = { version = "0.22", default-features = false, optional = true }

# IDs / time
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
