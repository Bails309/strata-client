# ── Clipboard diagnostics overlay ─────────────────────────────────────
#
# Turns on both ends of the clipboard tracing so a failing transfer can be
# attributed to a specific stage. Diagnostic only — do NOT leave this
# running in production: guacd at `-L trace` is extremely verbose, and the
# extra logging costs throughput on busy hosts.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.clipboard-debug.yml up -d guacd backend
#   docker compose logs -f guacd | grep -iE "CLIPRDR|clipboard"
#
# Revert with a plain `docker compose up -d guacd backend`.
#
# Neither tracer records clipboard *contents*. guacd logs CLIPRDR message
# types and byte counts; the backend tracer logs opcodes, stream indices,
# payload sizes and timings. Output is safe to attach to a ticket.
#
# What to look for after reproducing a failed copy — see
# docs/runbooks/clipboard-diagnostics.md:
#
#   `Received format data response.` with no following `Broadcasting
#   clipboard`   → guac_iconv() overran the buffer; the copy was dropped
#                  wholesale. Raise STRATA_CLIPBOARD_BUFFER_BYTES.
#   `CLIPRDR ... channel disconnected`
#                → FreeRDP tore the channel down; not a buffer problem.
#   no `Received format data response.` at all
#                → the RDP server never answered the format data request.
# ──────────────────────────────────────────────────────────────────────
services:
  guacd:
    # Base image CMD is ["-b", "0.0.0.0", "-L", "info", "-f"]. The CLIPRDR
    # lifecycle messages are logged at TRACE, so `debug` is not enough.
    command: ["-b", "0.0.0.0", "-L", "trace", "-f"]

  backend:
    environment:
      - STRATA_CLIPBOARD_TRACE=1
