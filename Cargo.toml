[workspace]
resolver = "2"
members = [
    "backend",
    "crates/strata-protocol",
    "crates/strata-dmz",
    "crates/strata-session",
]
# Vendored forks, built through [patch.crates-io] below rather than as
# members so workspace-wide lint and test runs stay on our own code.
exclude = [
    "crates/vendor/ironrdp-connector",
    "crates/vendor/ironrdp-egfx",
    "crates/vendor/sspi",
]

# Three vendored forks, all small, all temporary. Every fork here is a
# liability: re-check them on every dependency bump and delete the moment
# upstream catches up. `scripts/check-vendored-forks.sh` reports the state
# of each, and the reasoning for all three is in
# docs/adr/ADR-0015-native-rust-session-engine.md.
#
# - ironrdp-connector: 3 lines, unpins picky so current ironrdp resolves
#   beside a russh carrying the RUSTSEC-2026-0154 fix.
# - sspi: 1 line, drops a mechListMIC sequence check added in 0.22.0 that
#   rejects Kerberos NLA against Windows RDP hosts.
# - ironrdp-egfx: adds an AVC passthrough hook, so H.264 can reach the
#   browser's WebCodecs decoder without a local (C) decoder.
[patch.crates-io]
ironrdp-connector = { path = "crates/vendor/ironrdp-connector" }
ironrdp-egfx = { path = "crates/vendor/ironrdp-egfx" }
sspi = { path = "crates/vendor/sspi" }

# Cargo only honours profiles in the workspace root manifest.
[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.package]
version = "2.3.3"

edition = "2021"
license = "Apache-2.0"
authors = ["Strata Client contributors"]
repository = "https://github.com/Bails309/strata-client"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures-util = "0.3"
bytes = "1"

# Web framework
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "request-id", "limit", "timeout"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto / hashing
hmac = "0.13"
sha2 = "0.11"
rand = "0.10"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

# HTTP/2 link transport
h2 = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Observability
axum-prometheus = "0.10"

# Errors
thiserror = "2"
anyhow = "1"

# IDs / time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Session engine (strata-session)
winnow = "0.7"
async-trait = "0.1"
secrecy = "0.10"
