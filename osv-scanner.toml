# OSV-Scanner configuration for the Strata workspace.
#
# This file lives at the workspace root (next to Cargo.lock) so that
# osv-scanner — and the OpenSSF Scorecard `Vulnerabilities` check, which
# uses osv-scanner under the hood — picks it up automatically when scanning
# the Rust dependency graph. osv-scanner only applies an ignore-config when
# it lives in the same directory as the manifest/lockfile being scanned, so
# placing this at the workspace root is REQUIRED — a copy under `backend/`
# would silently be ignored.
#
# Reference: https://google.github.io/osv-scanner/configuration/
#
# The vendored forks under crates/vendor/ must not carry their own Cargo.lock
# (see .gitignore): Cargo never reads them, this config does not apply to
# them, and their stale pins were reported as live findings until removed.

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
reason = """
Marvin Attack timing side-channel in the pure-Rust `rsa` crate. No fixed
release exists upstream.

`rsa 0.10.0-rc.18` IS compiled into strata-backend, via the RDP stack:
`picky` / `sspi` / `winscard` <- vendored `ironrdp-connector` + `sspi` <-
strata-session. (`rsa 0.9.10` is locked but not compiled for the Linux
target; `jsonwebtoken` uses `aws_lc_rs` and `sqlx` excludes `sqlx-mysql`.)

The attack recovers plaintext by timing RSA PKCS#1 v1.5 *decryption with a
private key*. Strata never gives these crates an RSA private key: the RDP
engine only constructs `Credentials::UsernamePassword` (NTLM / Kerberos with
symmetric etypes), so the private-key paths that would decrypt with `rsa`
(PKINIT, PKU2U, smart-card credentials) are never reached.

Since v2.3.6 the SSH engine also uses the same `rsa` build (russh `rsa`
feature) so it can talk to devices with only RSA host keys. Verifying a
host's RSA signature is a public-key operation. An administrator-supplied
RSA *user* key signs once per login; the attack needs a very large number of
timed private-key operations observed by the attacker, which one signature
per session to the target being logged in to does not give.

Remove when `rsa` ships a constant-time release, or revisit if smart-card or
certificate-based RDP authentication is ever implemented.
"""

[[IgnoredVulns]]
id = "RUSTSEC-2023-0089"
reason = """
`atomic-polyfill` is unmaintained (informational, no vulnerability). It is
locked via sspi[scard] -> winscard -> iso7816 -> heapless 0.7, and is not
compiled for the Linux target (`cargo tree -p strata-backend -e normal -i
atomic-polyfill` prints nothing). On targets that do build it, it defers to
core::sync::atomic. No winscard / iso7816 release moves to heapless 0.8,
which dropped the shim, so it cannot be updated away. Mirrors the entry in
backend/.cargo/audit.toml; revisit when the vendored sspi fork is dropped.
"""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0192"
reason = """
`ttf-parser` is unmaintained (informational advisory, no vulnerability). It
arrives via `fontdue`, the glyph rasteriser the session engine's terminal
renderer uses for Guacamole Wire Compatibility Mode. The parser only ever
sees font files we ship in the container image, never network input, so an
unmaintained advisory carries no reachable risk here. Revisit if a vulnerability
is ever filed against it.
"""

