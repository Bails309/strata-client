# Exec target for tests/kube_live.rs, applied automatically by k3s.
#
# The first apply fails because k3s drops this in before the default
# service account exists; it retries and succeeds within ~15s, so wait
# for the pod rather than for the first apply.
apiVersion: v1
kind: Pod
metadata:
  name: strata-exec-target
  namespace: default
  labels:
    app: strata-exec-target
spec:
  # The pod exists to be exec'd into and nothing else, so it must outlive
  # the tests rather than run to completion.
  restartPolicy: Always
  terminationGracePeriodSeconds: 1
  containers:
    - name: shell
      image: busybox:1.37
      command: ["sh", "-c", "sleep 86400"]
      resources:
        limits:
          memory: 64Mi
