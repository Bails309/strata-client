# cargo-audit configuration.
#
# Advisories listed below are known and tracked. Each entry MUST have a
# justification and (where applicable) a tracking issue / review date.
# Re-evaluate quarterly and remove entries as upstream fixes land.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — `rsa` Marvin timing side-channel (medium).
    # Pulled in transitively by `jsonwebtoken` (RSA JWT verification) and by
    # `sqlx-macros-core` (MySQL compile-time checks, unused at runtime — we
    # only enable the `postgres` sqlx feature). No fixed upgrade is available
    # upstream. Mitigation: Strata does not expose RSA signing/decryption to
    # untrusted network timing; JWTs are verified server-side against trusted
    # OIDC JWKS. Revisit when `rsa` publishes a constant-time release.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0097 — `rand` 0.8.5 unsoundness with custom loggers
    # (warning, not a direct vulnerability). Only reachable via transitive
    # deps (`tungstenite`, `sqlx-*`, `num-bigint-dig`, `jsonwebtoken`) which
    # have not yet migrated to rand 0.9. Strata's own code uses rand 0.9.3.
    # Remove once upstream crates publish rand-0.9 releases.
    "RUSTSEC-2026-0097",

    # RUSTSEC-2026-0192 — `ttf-parser` is unmaintained (not vulnerable).
    # Arrives via `fontdue`, the glyph rasteriser the session engine's
    # terminal renderer uses for Guacamole Wire Compatibility Mode. The
    # parser only ever sees font files we ship in the image, never network
    # input, so an unmaintained advisory carries no reachable risk here.
    # Revisit if a vulnerability is ever filed against it.
    "RUSTSEC-2026-0192",

    # RUSTSEC-2023-0089 — `atomic-polyfill` is unmaintained (not vulnerable).
    # NEW with the ironrdp 0.17 / sspi 0.22 upgrade, via
    # sspi[scard] -> winscard -> iso7816 -> heapless 0.7 -> atomic-polyfill.
    # No newer winscard/iso7816 exists that moves to heapless 0.8 (which
    # dropped the shim), so it cannot be updated away.
    # The crate is a compile-time shim providing atomics on targets that
    # lack them; on x86_64 it defers to core::sync::atomic. More to the
    # point it is unreachable: the whole chain hangs off smart-card
    # credentials, and Strata only ever builds Credentials::Username.
    # Removing it outright means dropping sspi's "scard" feature and the
    # Credentials::SmartCard path from crates/vendor/ironrdp-connector —
    # doable, but it widens a fork we intend to delete. Revisit when the
    # connector fork goes, or if smart-card RDP auth is ever implemented.
    "RUSTSEC-2023-0089",
]
