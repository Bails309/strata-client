name: "Strata CodeQL config"

# Exclude vendored / generated artefacts from analysis. These files are not
# authored by the Strata team and findings against them are noise.
paths-ignore:
  - frontend/src/lib/guacamole-vendor.js
  - frontend/src/guacamole-common-js.d.ts
  - frontend/dist/**
  - frontend/coverage/**
  - backend/target/**
  - "**/node_modules/**"

query-filters:
  # rust/cleartext-logging produces false positives on X.509 subject_public_key
  # and Guacamole wire protocol disconnection notices in strata-session.
  - exclude:
      id: rust/cleartext-logging
  # rust/hard-coded-cryptographic-value flags unit test fixtures (mock keys/passwords
  # in #[cfg(test)] modules) and Chromium Linux OSCrypt specification compatibility
  # constants (b"peanuts", b"saltysalt", and static IV).
  - exclude:
      id: rust/hard-coded-cryptographic-value
  # actions/unpinned-tag flags SLSA GitHub Generator reusable workflows
  # (slsa-framework/slsa-github-generator) in release.yml. The SLSA framework
  # normative specification requires semantic version tags (e.g., @v2.1.0) so
  # slsa-verifier can authenticate the builder identity; pinning to a commit SHA
  # breaks SLSA provenance generation and verification. All other repository actions
  # are pinned to full commit SHAs.
  - exclude:
      id: actions/unpinned-tag

