# Live SSH target for `crates/strata-session/tests/ssh_live.rs`.
#
# These tests are `#[ignore]`d by default because they need a real sshd.
# To run them:
#
#   docker compose -f docker-compose.ssh-test.yml up -d --build
#   docker exec strata-ssh-target \
#       ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub
#   # then run the test container on the strata-ssh-test network with
#   # STRATA_SSH_TEST_* set (see the test file header).
#   docker compose -f docker-compose.ssh-test.yml down
#
# Isolated network, no published ports: nothing here is reachable from
# outside the Docker host.
name: strata-ssh-test

services:
  sshd:
    build: ./crates/strata-session/tests/sshd
    container_name: strata-ssh-target
    networks:
      - ssh-test

networks:
  ssh-test:
    name: strata-ssh-test-net
