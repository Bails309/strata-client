name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # ── Secrets scanning ──────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action v3 calls `GET /repos/{owner}/{repo}/pulls/{n}/commits`
      # on pull_request events to scan only the PR's changed commits.
      # Without this permission the action exits 403 ("Resource not accessible
      # by integration"). Read-only is sufficient — the action does not write.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Dependency advisory scanning (Coding Standards §13.2 / §18.2) ──
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Rust: RustSec advisory database
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0

      - name: Cache cargo-audit binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-bin

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi

      - name: Run cargo audit (workspace)
        working-directory: backend
        # Fail on vulnerabilities, unsound, and unmaintained advisories.
        # Yanked crates remain informational (no RUSTSEC ID to ignore).
        # Per-advisory ignores with justifications live in
        # backend/.cargo/audit.toml (auto-picked up by cargo-audit from
        # the working directory).
        # After the DMZ workspace conversion (Phase 0 of the DMZ plan)
        # the single resolved Cargo.lock lives at the repo root; point
        # cargo-audit at it explicitly so it audits the full closure
        # (backend + strata-protocol + strata-dmz).
        #
        # cargo-audit fetches the RustSec advisory DB from GitHub on
        # every run, which is occasionally flaky on hosted runners
        # ("An IO error occurred when talking to the server"). Retry
        # a few times with backoff before failing the gate so a single
        # transient network blip doesn't break CI.
        run: |
          set -e
          attempts=3
          for i in $(seq 1 $attempts); do
            if cargo audit -f ../Cargo.lock --deny unsound --deny unmaintained; then
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then
              echo "::warning::cargo audit failed (attempt $i/$attempts); retrying in $((i * 10))s"
              sleep $((i * 10))
            fi
          done
          echo "::error::cargo audit failed after $attempts attempts"
          exit 1

      # cargo-audit only catches RUSTSEC IDs. cargo-deny adds:
      #   • License allow-list — block GPL/AGPL/non-SPDX licenses
      #     before they end up in a release artefact (Apache-2.0
      #     project, see deny.toml).
      #   • Banned-crate list — enforce the rustls-only TLS policy
      #     by failing the gate if `openssl` / `native-tls` enters
      #     the dep tree via a transitive bump.
      #   • Source allow-list — refuse to build against unknown
      #     registries or arbitrary git forks.
      # Config lives at repo-root deny.toml.
      - name: Cache cargo-deny binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-bin
      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --locked
          fi
      - name: Run cargo deny (licenses, bans, sources)
        run: cargo deny --all-features check bans licenses sources

      # Node: npm advisory database
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

      - name: npm audit (e2e)
        working-directory: e2e
        run: npm audit --audit-level=high --omit=dev

  # ── Database migration validation ─────────────────────────────────
  migrations-check:
    name: DB Migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
          POSTGRES_DB: strata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
      - name: Apply all migrations
        env:
          DATABASE_URL: postgres://strata:strata@localhost:5432/strata
        run: sqlx migrate run --source backend/migrations
      - name: Verify no pending migrations
        env:
          DATABASE_URL: postgres://strata:strata@localhost:5432/strata
        run: |
          # Re-run should be a no-op. Capture output; fail if any "applied" lines appear.
          OUT=$(sqlx migrate run --source backend/migrations)
          echo "$OUT"
          if echo "$OUT" | grep -i "applied"; then
            echo "ERROR: migrations were not idempotent"
            exit 1
          fi

  # ── Backend: lint, check, test ────────────────────────────────────
  backend-check:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    # Tests that need a database skip themselves when TEST_DATABASE_URL is
    # unset. Without this service they all passed by skipping, including
    # the audit-chain, least-privilege role and AD-sync pin tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
          POSTGRES_DB: strata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Workspace target lives at repo root since the DMZ refactor.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'backend/Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-v2-

      - name: Check formatting
        # Every first-party crate; the vendored forks are not ours to format.
        run: |
          cargo fmt -p strata-backend -- --check
          cargo fmt -p strata-session -- --check
          cargo fmt -p strata-protocol -- --check
          cargo fmt -p strata-dmz -- --check

      - name: Clippy lint
        # --all-features on strata-session: the protocol engines (rdp, vnc,
        # kubernetes, sftp, terminal) are all opt-in, so the default feature
        # set lints almost none of the crate.
        run: |
          cargo clippy -p strata-backend --all-targets -- -D warnings
          cargo clippy -p strata-session --all-features --all-targets -- -D warnings
          cargo clippy -p strata-protocol --all-targets -- -D warnings
          cargo clippy -p strata-dmz --all-targets -- -D warnings

      - name: Install fonts for the terminal rasteriser
        # SSH and Kubernetes tests render through a real monospace font.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-dejavu-core

      - name: Cache sqlx-cli binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/sqlx
          key: ${{ runner.os }}-sqlx-cli-bin

      - name: Install sqlx-cli
        run: |
          if ! command -v sqlx >/dev/null 2>&1; then
            cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
          fi

      - name: Migrate the test database
        env:
          DATABASE_URL: postgres://strata:strata@localhost:5432/strata
        run: sqlx migrate run --source migrations

      - name: Run unit tests
        env:
          TEST_DATABASE_URL: postgres://strata:strata@localhost:5432/strata
        run: cargo test -p strata-backend -- --test-threads=1

      - name: Prove the database tests ran
        # A skipped DB test still reports "ok", so check for a side effect
        # instead. The audit tests draw from this sequence, which advances
        # even when the test's transaction is rolled back.
        run: |
          called=$(docker exec "${{ job.services.postgres.id }}" \
            psql -U strata -d strata -tAc "SELECT is_called FROM audit_logs_id_seq")
          if [ "$called" != "t" ]; then
            echo "::error::DB-backed tests skipped: TEST_DATABASE_URL did not reach them"
            exit 1
          fi

      - name: Run strata-protocol unit tests
        # Pure-rust crate, runs fast and shares the cargo cache; doing
        # this in the same job keeps DMZ protocol coverage on the
        # critical-path PR check rather than relying on the
        # dmz-deps.yml workflow which only builds, never tests.
        working-directory: .
        run: cargo test -p strata-protocol

      - name: Run strata-dmz unit tests
        # The DMZ edge crate is a separate process at runtime but it
        # ships in the same workspace; run its unit tests on the PR
        # critical path so regressions in ws_proxy / link_server /
        # edge_signer / public_tls fail the gate immediately rather
        # than slipping through to release builds.
        working-directory: .
        run: cargo test -p strata-dmz

      - name: Run strata-session unit tests
        # Native Rust session engine (ADR-0015) replacing guacd.
        # --all-features: every protocol engine is opt-in, and the default
        # feature set runs well under half of the crate's tests.
        working-directory: .
        run: cargo test -p strata-session --all-features --lib

      - name: Check strata-session fuzz targets compile
        working-directory: .
        run: cargo check --manifest-path crates/strata-session/fuzz/Cargo.toml

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Generate backend coverage report
        # Vendored forks are third-party source we do not test. They are
        # path dependencies, so tarpaulin instruments them unless excluded
        # and ~28k uncovered lines sink the percentage. Both globs are
        # given because tarpaulin is inconsistent about `*` crossing `/`.
        run: cargo tarpaulin -p strata-backend --skip-clean --out xml --out html --output-dir coverage/ --exclude-files src/main.rs --exclude-files 'crates/vendor/*' --exclude-files 'crates/vendor/**/*' --fail-under 19 -- --test-threads=1

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14

  # ── Session engines against real servers ──────────────────────────
  # The *_live.rs suites are #[ignore]d because they need targets.
  # docker-compose.session-test.yml provides them (OpenSSH, a FreeRDP
  # shadow server that speaks CredSSP, xrdp as the fail-closed target, and
  # k3s); without this job those suites only ever ran on a developer's
  # machine.
  session-live:
    name: Session engines (live targets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0

      - name: Cache Cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-live-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-live-

      - name: Install fonts for the terminal rasteriser
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-dejavu-core

      - name: Start live targets
        run: docker compose -f docker-compose.session-test.yml up -d --build

      - name: Build the live test binaries
        # Compiles while k3s and the RDP targets finish starting.
        run: cargo test -p strata-session --all-features --no-run --test ssh_live --test sftp_live --test rdp_live --test kube_live

      - name: Wait for targets and export their details
        run: |
          set -euo pipefail
          # The fixture publishes no ports. Reach each container on the
          # bridge network under its own name, which is also the name the
          # k3s certificate is issued for.
          for c in strata-ssh-target strata-rdp-target strata-rdp-legacy strata-kube-target; do
            ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$c")
            echo "$ip $c" | sudo tee -a /etc/hosts
          done
          wait_port() {
            timeout 120 bash -c "until (echo > /dev/tcp/$1/$2) 2>/dev/null; do sleep 2; done"
          }
          wait_port strata-ssh-target 22
          wait_port strata-rdp-target 3389
          wait_port strata-rdp-legacy 3389
          # k3s fails the first manifest apply (no default service account
          # yet) and retries, so wait for the pod rather than the apply.
          timeout 300 bash -c 'until docker exec strata-kube-target kubectl get pod strata-exec-target >/dev/null 2>&1; do sleep 3; done'
          docker exec strata-kube-target kubectl wait --for=condition=Ready pod/strata-exec-target --timeout=300s
          docker cp strata-kube-target:/output/kubeconfig.yaml "$RUNNER_TEMP/kubeconfig.yaml"
          fp=$(docker exec strata-ssh-target ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub | awk '{print $2}')
          echo "STRATA_SSH_TEST_FINGERPRINT=$fp" >> "$GITHUB_ENV"
          echo "STRATA_KUBE_TEST_CONFIG=$RUNNER_TEMP/kubeconfig.yaml" >> "$GITHUB_ENV"

      - name: Run live engine tests
        env:
          STRATA_SSH_TEST_HOST: strata-ssh-target
          STRATA_SSH_TEST_USER: strata
          STRATA_SSH_TEST_PASSWORD: strata-test-password
          STRATA_RDP_TEST_HOST: strata-rdp-target
          STRATA_RDP_LEGACY_HOST: strata-rdp-legacy
          STRATA_RDP_TEST_USER: strata
          STRATA_RDP_TEST_PASSWORD: strata-test-password
          STRATA_KUBE_TEST_HOST: strata-kube-target
        run: cargo test -p strata-session --all-features --test ssh_live --test sftp_live --test rdp_live --test kube_live -- --ignored

      - name: Show target logs on failure
        if: failure()
        run: docker compose -f docker-compose.session-test.yml logs --tail=100

      - name: Stop live targets
        if: always()
        run: docker compose -f docker-compose.session-test.yml down -v

  # ── Repository lint: workflows, shell, Helm, Compose ─────────────
  repo-lint:
    name: Repo Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint (workflows)
        # The image bundles shellcheck, so `run:` blocks are checked too.
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      - name: shellcheck (scripts)
        run: |
          # shellcheck disable=SC2046 # one argument per tracked script
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            --severity=warning $(git ls-files '*.sh')

      - name: Helm lint and render (strata-dmz chart)
        run: |
          set -euo pipefail
          helm() {
            docker run --rm -v "$PWD/deploy/helm:/charts:ro" \
              alpine/helm:4.3.0@sha256:a6cf54599ccb99d90cf0712b30f03fdb3cab062e6b94e0418cc4db7e8a1464b2 "$@"
          }
          repo=registry.example.invalid/strata-dmz
          helm lint --strict /charts/strata-dmz --set image.repository="$repo"
          helm template ci /charts/strata-dmz --set image.repository="$repo" > /dev/null
          # No public image is published, so a missing repository must fail.
          if helm template ci /charts/strata-dmz > /dev/null 2>&1; then
            echo "::error::chart rendered without image.repository"
            exit 1
          fi

      - name: Compose files render
        run: sh scripts/ci/validate-compose.sh

  # ── Frontend: lint, typecheck, unit tests ─────────────────────────
  frontend-check:
    name: Frontend (React)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ESLint runs as a hard gate. The historical 198-error baseline of
      # `jsx-a11y/label-has-associated-control` and `no-autofocus` issues has
      # been demoted to warnings (tracked under W4-2 for per-page ratchet);
      # all remaining errors are correctness/security and must stay at zero.
      - name: ESLint (frontend)
        run: npm run lint

      - name: Prettier format check (frontend)
        run: npm run format:check

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

      - name: Build
        run: npm run build

  # ── E2E tests (requires running stack) ────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [backend-check, frontend-check]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and load backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./backend/Dockerfile
          tags: strata/backend:latest
          load: true
          cache-from: type=gha,scope=backend

      - name: Build and load frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./frontend/Dockerfile
          tags: strata/frontend:latest
          load: true
          cache-from: type=gha,scope=frontend

      - name: Start all services
        run: docker compose --profile local-db up -d --wait
        timeout-minutes: 10
        env:
          DEFAULT_ADMIN_PASSWORD: admin

      - name: Verify service logs on startup
        if: always()
        run: |
          echo "=== Container health status ==="
          docker compose ps -a
          echo ""
          echo "=== Health inspect ==="
          for svc in vault postgres-local backend frontend; do
            cid=$(docker compose ps -q $svc 2>/dev/null || true)
            if [ -n "$cid" ]; then
              echo "--- $svc ---"
              docker inspect --format='{{.State.Status}} health={{.State.Health.Status}}' "$cid" 2>/dev/null || echo "(no health)"
              docker inspect --format='{{range .State.Health.Log}}{{.ExitCode}}: {{.Output}}{{end}}' "$cid" 2>/dev/null || true
            fi
          done
          echo ""
          echo "=== All service logs (last 80 lines each) ==="
          docker compose logs --tail=80

      - name: Save docker compose logs
        if: always()
        run: docker compose logs --no-color > /tmp/docker-compose-logs.txt 2>&1

      - name: Upload docker compose logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-compose-logs
          path: /tmp/docker-compose-logs.txt
          retention-days: 7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium

      # Silent test deletion guard: Playwright happily passes when
      # there are zero tests. Pin a floor so accidentally renaming a
      # spec file or scoping a `.only()` to one block can't make the
      # gate go green by erasing coverage. Bump this number whenever
      # a new spec is intentionally added.
      - name: Enforce E2E test count floor
        working-directory: e2e
        env:
          E2E_TEST_FLOOR: '162'
        run: |
          COUNT=$(npx playwright test --list --reporter=json | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const j=JSON.parse(s);const walk=(suites,n=0)=>suites.reduce((acc,su)=>acc+(su.specs?.length||0)+walk(su.suites||[],0),n);console.log(walk(j.suites||[]));})")
          echo "Discovered $COUNT E2E tests (floor: $E2E_TEST_FLOOR)"
          if [ "$COUNT" -lt "$E2E_TEST_FLOOR" ]; then
            echo "ERROR: E2E test count $COUNT below floor $E2E_TEST_FLOOR — did a spec get accidentally deleted or scoped?"
            exit 1
          fi

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test
        env:
          BASE_URL: http://localhost

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 50

      - name: Stop services
        if: always()
        run: docker compose --profile local-db down -v

  # ── Docker image builds (no push on PR) ───────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [backend-check, frontend-check]
    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: ./backend/Dockerfile
          - service: frontend
            dockerfile: ./frontend/Dockerfile
          # The public edge. Its Dockerfile has broken before without
          # any check noticing, because nothing else builds it.
          - service: strata-dmz
            dockerfile: ./crates/strata-dmz/Dockerfile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
